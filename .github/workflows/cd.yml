name: CD — Deploy to Production

# Production deploys are explicit: create and push a semantic version tag.
# The release gate requires that exact commit to be on main and have a
# successful completed CI run before any production environment is touched.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require release commit on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit on main." >&2
            exit 1
          fi

      - name: Require successful CI for release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="$GITHUB_SHA" \
              -f event=push \
              -f status=completed \
              --jq '.workflow_runs | map(select(.head_branch == "main")) | first | .conclusion // ""'
          )"

          if [ "$conclusion" != "success" ]; then
            echo "A successful completed CI run on main is required for $GITHUB_SHA." >&2
            exit 1
          fi

  deploy:
    name: Deploy to Production VPS
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "Missing required production secret: $name" >&2
              exit 1
            fi
          done

      - name: Deploy release via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: DEPLOY_PATH,RELEASE_SHA,RELEASE_TAG
          script: |
            set -eu

            echo "==> Navigating to deploy directory"
            cd "$DEPLOY_PATH"

            echo "==> Fetching release $RELEASE_TAG"
            git fetch origin --force \
              "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

            tag_sha="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
            if [ "$tag_sha" != "$RELEASE_SHA" ]; then
              echo "Release tag SHA does not match the validated GitHub SHA." >&2
              exit 1
            fi
            git checkout --detach "$RELEASE_SHA"

            echo "==> Validating Docker Compose configuration"
            docker compose config --quiet

            echo "==> Pulling infrastructure images"
            docker compose pull postgres redis

            echo "==> Building application images"
            docker compose build migrate api worker web

            echo "==> Starting required infrastructure"
            docker compose up -d --wait postgres redis

            echo "==> Applying database migrations"
            docker compose run --rm migrate

            echo "==> Restarting application services"
            docker compose up -d --no-deps --wait api worker web

            echo "==> Verifying service health"
            docker compose ps

            echo "==> Cleaning up unused Docker images"
            docker image prune -f

            echo "==> Deploy complete — $RELEASE_TAG"

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "🚨 DeployForge production deploy FAILED for tag ${{ github.ref_name }}"
            attachments:
              - color: danger
                fields:
                  - title: Repository
                    value: ${{ github.repository }}
                    short: true
                  - title: Tag
                    value: ${{ github.ref_name }}
                    short: true
                  - title: Run URL
                    value: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
