packages:
  - 'apps/*'
  - 'packages/database'
  - 'packages/mail'
  - 'packages/security'
  - 'packages/shared'
  - 'packages/vps'

minimumReleaseAge: 0

allowBuilds:
  '@prisma/engines': true
  argon2: true
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  ssh2: true
  unrs-resolver: true
  workerd: true

overrides:
  '@fastify/busboy': 3.2.4
  baseline-browser-mapping: 2.11.32
  browserslist: 4.29.4
  deepmerge-ts: 8.0.2
  fast-uri: 4.2.3
  lodash: 4.18.1
  mysql2: 3.24.6
  source-map-js: 1.2.2
  ws: 8.22.0
